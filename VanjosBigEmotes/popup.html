<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Big Emotes Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Big Emotes</h1>

    <label for="scale">Scale</label>

    <input
      type="range"
      id="scale"
      min="1"
      max="4"
      step="0.1"
      value="1.8"
    />

    <div id="scaleValue">1.8x</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
